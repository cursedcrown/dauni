<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>позор УАТ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header>

        <h1>позор УАТ</h1>

        <p>
            Здесь можно познакомиться с нашей группой
        </p>

        <button
            id="adminButton"
            type="button"
        >
            🔐 Войти как администратор
        </button>

    </header>


    <!-- ================= -->
    <!-- Форма администратора -->
    <!-- ================= -->

    <section
        id="adminPanel"
        class="admin-panel hidden"
    >

        <h2>Админ-панель</h2>

        <form id="personForm">

            <input
                type="text"
                id="name"
                placeholder="Имя и фамилия"
                required
            >

            <textarea
                id="bio"
                placeholder="Биография"
                required
            ></textarea>

            <input
                type="file"
                id="photo"
                accept="image/*"
                required
            >

            <button type="submit">
                Добавить дауна
            </button>

        </form>

        <button
            id="logoutButton"
            type="button"
        >
            Выйти
        </button>

    </section>


    <!-- ================= -->
    <!-- Список людей -->
    <!-- ================= -->

    <main>

        <div id="peopleList">
            Загрузка...
        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
